name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Prepare kernel (bundled or download)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $k = "bin/clash.meta.exe"
          if ((Test-Path $k) -and ((Get-Item $k).Length -gt 20MB)) {
            Write-Output "复用仓库内置内核: $((Get-Item $k).Length) bytes"
          } else {
            $url = "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-windows-amd64-compatible-v1.19.31.zip"
            Write-Output "下载内核: $url"
            Invoke-WebRequest -Uri $url -OutFile mihomo.zip -UseBasicParsing
            Expand-Archive -Path mihomo.zip -DestinationPath mihomo_tmp -Force
            $exe = Get-ChildItem mihomo_tmp -Filter "*.exe" | Select-Object -First 1
            Copy-Item $exe.FullName $k -Force
          }
          Write-Output "内核大小: $((Get-Item $k).Length) bytes"

          # 分流规则需要 GeoIP / GeoSite 数据；缺失时内核会跳过国内直连规则
          foreach ($pair in @(
              @{ name = "geoip.dat";   url = "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat" },
              @{ name = "geosite.dat"; url = "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat" }
          )) {
            $dst = Join-Path "bin" $pair.name
            if ((Test-Path $dst) -and ((Get-Item $dst).Length -gt 1MB)) {
              Write-Output "复用已有 $($pair.name)"
            } else {
              Write-Output "下载 $($pair.name) ..."
              Invoke-WebRequest -Uri $pair.url -OutFile $dst -UseBasicParsing
            }
          }
          Get-ChildItem bin | Select-Object Name, Length

      - name: Build (amd64, WebView2 native window, cgo)
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "1"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o "dist/ProxyPilot.exe" .
          Get-Item dist/ProxyPilot.exe | Select-Object Name, Length

      - name: Build (amd64, console debug variant)
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "1"
          go build -trimpath -ldflags "-s -w" -o "dist/ProxyPilot-debug.exe" .

      - name: Package (all-in-one, zero config)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg/bin | Out-Null
          Copy-Item dist/ProxyPilot.exe       pkg/ProxyPilot.exe
          Copy-Item dist/ProxyPilot-debug.exe pkg/ProxyPilot-debug.exe
          Copy-Item README.md                 pkg/README.md
          Copy-Item bin/clash.meta.exe        pkg/bin/clash.meta.exe
          if (Test-Path "bin/geoip.dat")   { Copy-Item bin/geoip.dat   pkg/bin/geoip.dat }
          if (Test-Path "bin/geosite.dat") { Copy-Item bin/geosite.dat pkg/bin/geosite.dat }
          Compress-Archive -Path pkg/* -DestinationPath dist/ProxyPilot-win.zip -Force
          Write-Output "--- package contents ---"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::OpenRead("dist/ProxyPilot-win.zip").Entries |
            ForEach-Object { Write-Output ("  {0} ({1:N0} bytes)" -f $_.FullName, $_.Length) }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProxyPilot-windows
          path: |
            dist/ProxyPilot.exe
            dist/ProxyPilot-debug.exe
            dist/ProxyPilot-win.zip
          retention-days: 30
