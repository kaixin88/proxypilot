name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build (windows/amd64)
        shell: pwsh
        run: |
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          $env:CGO_ENABLED="0"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o "dist/ProxyPilot.exe" .
          Get-Item dist/ProxyPilot.exe | Select-Object Name,Length

      - name: Build (windows/386 for older win10)
        shell: pwsh
        run: |
          $env:GOOS="windows"
          $env:GOARCH="386"
          $env:CGO_ENABLED="0"
          go build -trimpath -ldflags "-s -w" -o "dist/ProxyPilot-386.exe" .

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg/bin | Out-Null
          Copy-Item dist/ProxyPilot.exe pkg/ProxyPilot.exe
          Copy-Item README.md pkg/README.md
          Compress-Archive -Path pkg/* -DestinationPath dist/ProxyPilot-win.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProxyPilot-windows
          path: dist/*
